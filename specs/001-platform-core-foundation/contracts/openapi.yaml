          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleOperation"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/modules/{moduleId}/uninstallation:
    post:
      tags: [Modules]
      operationId: uninstallModule
      summary: Drain and uninstall a tenant module
      description: |
        Uninstallation enters pending state and stops accepting new work, then
        drains already-assigned event deliveries. It remains pending until every
        assigned event is processed, including persistent failures; failures
        require authorized replay or recovery and are never silently waived.
        The tenant enablement is removed only after the drain condition is
        satisfied. Shared code cannot be stopped or unregistered while another
        tenant still has an active enablement.
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ModuleId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "202":
          description: Uninstallation is draining assigned events.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleOperation"
        "200":
          description: Uninstallation completed because no assigned deliveries remained.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledModule"
        default:
          $ref: "#/components/responses/StandardError"
  /platform/modules/operations/{operationId}:
    get:
      tags: [Modules, Platform]
      operationId: getModuleLifecycleOperation
      summary: Get module lifecycle operation status
      security:
        - PlatformJWT: []
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Lifecycle operation state and safe diagnostic summary.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleOperation"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/operations/{operationId}:
    get:
      tags: [Modules]
      operationId: getTenantLifecycleOperation
      summary: Get a lifecycle operation in the authenticated tenant
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Lifecycle operation state and safe diagnostic summary.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleOperation"
        default:
          $ref: "#/components/responses/StandardError"

  /scaffolds/modules:
    post:
      tags: [Scaffolding]
      operationId: scaffoldModule
      summary: Generate a module from the current governed template
      description: |
        Returns an artifact or generation result containing a manifest,
        directory convention, domain/event/query templates, tests, and current
        standards metadata. Scaffolding does not register, approve, or install
        executable module code.
      security:
        - TenantJWT: []
        - ApiCredential: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaffoldModuleRequest"
      responses:
        "201":
          description: Scaffold generated.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScaffoldResult"
        default:
          $ref: "#/components/responses/StandardError"
  /scaffolds/standards:
    get:
      tags: [Scaffolding]
      operationId: getCurrentScaffoldStandards
      summary: Get current scaffold template and enforced standards version
      security:
        - TenantJWT: []
        - ApiCredential: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Current template and standards metadata.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScaffoldStandards"
        default:
