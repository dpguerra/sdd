  /platform/modules/submissions/{submissionId}/artifact:
    get:
      tags: [Modules, Platform]
      operationId: getModuleSubmissionArtifact
      summary: Download a submitted artifact for operator review
      security:
        - PlatformJWT: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Exact submitted artifact; verify its digest against submission metadata before review.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
