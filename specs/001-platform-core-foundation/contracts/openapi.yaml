          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryAcceptance"
        default:
          $ref: "#/components/responses/StandardError"

components:
  securitySchemes:
    TenantJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived tenant access token. Required validated claims include iss,
        aud, sub, tenant_id, roles, iat, and exp. The authenticated tenant is
        resolved from the verified token and membership, never trusted from a
        caller-controlled tenant header or body.
        For delegated parent-to-child administration, send
        X-Delegated-Tenant-Grant. The server resolves the grant and replaces
        effective tenant context with the exact child tenant; no hierarchy
        inheritance or transitive access is implied.
    PlatformJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Separately authenticated platform-operator token with platform
        authority, audience, issuer, subject, iat, and exp claims. Tenant roles
        cannot grant platform authority. Platform operations are explicitly
        authorized and audited.
    ApiCredential:
      type: apiKey
      in: header
      name: X-API-Credential
      description: |
        Tenant-bound, permission-scoped credential. The server resolves its
        tenant from the credential verifier; any path tenant must match.
        Credential secrets are shown only on initial issuance.
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: |
        Must equal the authenticated tenant context except on explicitly
        platform-authorized operations or explicitly governed delegated
        parent-to-child operations. Delegated requests must also carry
        X-Delegated-Tenant-Grant and the server resolves effective context to
        this child tenant; this path value never itself grants authority.
      schema:
        type: string
        minLength: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Client-supplied correlation identifier; validated, bounded, and propagated or generated by the platform.
      schema:
        type: string
        maxLength: 128
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context parent; validated and propagated, or a new trace is created when absent.
      schema:
        type: string
        minLength: 1
    DelegatedTenantGrant:
      name: X-Delegated-Tenant-Grant
      in: header
      required: false
      description: |
        Opaque grant identifier for an explicit child-owned grant permitting
        the supplied parent TenantJWT principal to perform only the granted
        canonical operation permissions against the child tenant. The server
        rechecks the direct parent relationship and grant on every request.
        Effective tenant context is the child; hierarchy alone grants nothing.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable opaque key for a logical state-changing request. Scope is principal, tenant (if applicable), and operation. Concurrent duplicate keys produce one effect; a key reused with a different request returns 409. Each deployment defines key retention sufficient to cover its supported retry and asynchronous completion windows, including applicable retries after completion. Asynchronous operation keys are never deleted before completion; no universal numeric retention period is prescribed.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the version being changed; missing or stale preconditions fail without applying the mutation.
      schema:
        type: string
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: Required when replacing an existing resource; mutually exclusive with If-None-Match.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Use * only when creating a resource that does not yet exist; mutually exclusive with If-Match. Exactly one concurrency precondition is required.
      schema:
        type: string
        const: "*"
    PageToken:
      name: pageToken
      in: query
      required: false
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  headers:
    CorrelationId:
      description: Correlation identifier for this request and downstream work.
      schema:
        type: string
    ETag:
      description: Strong opaque entity version used for conditional updates.
      schema:
        type: string
  responses:
    StandardError:
      description: RFC 9457-style error. Error responses include a stable code and correlation identifier; details never contain credentials or secret values.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details extended with stable platform error code and correlation context.
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe diagnostic; must not disclose secrets or cross-tenant resource existence.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
            - authentication_required
            - invalid_credentials
            - authorization_denied
            - tenant_context_required
            - tenant_context_mismatch
            - tenant_suspended
            - resource_not_found
            - validation_failed
            - idempotency_key_reused
            - precondition_required
            - precondition_failed
            - conflict
            - module_not_approved
            - module_standards_not_met
            - dependency_cycle
            - lifecycle_conflict
            - event_schema_invalid
            - event_delivery_pending
            - secret_unavailable
            - rate_limited
            - dependency_unavailable
        correlationId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
      additionalProperties: true
    FieldError:
      type: object
      required: [pointer, code, message]
      properties:
        pointer:
          type: string
        code:
          type: string
        message:
          type: string
      additionalProperties: false
    HealthStatus:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok, ready]
        timestamp:
          type: string
          format: date-time
      additionalProperties: false
    TenantStatus:
      type: string
      enum: [active, suspended]
    Tenant:
      type: object
      required: [id, name, slug, status, parentTenantId, createdAt, updatedAt, version]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: "^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$"
          maxLength: 63
          description: Globally unique under case-insensitive comparison.
        status:
          $ref: "#/components/schemas/TenantStatus"
        parentTenantId:
          type: [string, "null"]
          description: Direct parent tenant. This relationship is organizational metadata only and never implies delegated access.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    CreateTenantRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: "^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$"
          maxLength: 63
          description: Globally unique under case-insensitive comparison; comparison and collision handling are defined by the platform.
        parentTenantId:
          type: string
          description: Optional direct-parent relationship set only by platform-controlled provisioning; this field grants no access.
      additionalProperties: false
    UpdateTenantRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: "^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$"
          maxLength: 63
          description: Globally unique under case-insensitive comparison, regardless of parent-child relationships.
      additionalProperties: false
    TenantSuspensionRequest:
      type: object
      required: [status, reason]
      properties:
        status:
          $ref: "#/components/schemas/TenantStatus"
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      additionalProperties: false
    CreateDelegatedAdminGrantRequest:
      type: object
      required: [parentTenantId, permissions]
      properties:
        parentTenantId:
          type: string
          minLength: 1
          description: Must equal the authenticated child's direct parent.
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Explicit canonical operationIds permitted for delegated child-context administration.
      additionalProperties: false
    DelegatedAdminGrant:
      type: object
      required: [id, childTenantId, parentTenantId, permissions, status, createdBy, createdAt, updatedAt, version]
      properties:
        id:
          type: string
        childTenantId:
          type: string
        parentTenantId:
          type: string
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        status:
          type: string
          enum: [active, revoked]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    DelegatedAdminGrantPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DelegatedAdminGrant"
    TenantPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Tenant"
    TenantLoginRequest:
      type: object
      required: [tenantId, email, password]
      properties:
        tenantId:
          type: string
        email:
          type: string
          format: email
          description: Account lookup is case-insensitive within the supplied tenant only.
        password:
          type: string
          format: password
          writeOnly: true
      additionalProperties: false
    PlatformLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
      additionalProperties: false
    AccessTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, tenantId, userId, roles]
      properties:
        accessToken:
          type: string
          description: Short-lived signed JWT; never place in URLs or logs.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 900
          description: Access token lifetime in seconds.
        tenantId:
          type: string
        userId:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TenantRole"
      additionalProperties: false
    PlatformAccessTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, authority]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 900
        authority:
          type: string
          const: platform_operator
      additionalProperties: false
    TenantRole:
      type: string
      enum:
        - tenant_admin
        - user
        - billing_manager
        - developer
        - governance_officer
    User:
      type: object
      required: [id, tenantId, email, displayName, roles, status, createdAt, version]
      properties:
        id:
          type: string
        tenantId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TenantRole"
        status:
          type: string
          enum: [active, suspended]
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    CreateUserRequest:
      type: object
      required: [email, password, displayName, roles]
      properties:
        email:
          type: string
          format: email
          description: Must be unique case-insensitively within the authenticated tenant; the same email may exist in another tenant.
        password:
          type: string
          format: password
          writeOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TenantRole"
      additionalProperties: false
    BootstrapTenantAdministratorRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          description: Must be unique case-insensitively within the target tenant; the same email may exist in another tenant.
        password:
          type: string
          format: password
          writeOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [active, suspended]
      additionalProperties: false
    ReplaceRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TenantRole"
      additionalProperties: false
    UserPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"
    IssueApiCredentialRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: ["events:read", "events:publish", "events:subscribe", "scaffolds:read", "scaffolds:write", "configuration:read", "telemetry:write"]
            description: Credential scopes from the governed catalog, limited by the issuer's current authority.
        expiresAt:
          type: [string, "null"]
          format: date-time
      additionalProperties: false
    ApiCredential:
      type: object
      required: [id, tenantId, ownerUserId, name, prefix, permissions, createdAt, status, version]
      properties:
        id:
          type: string
        tenantId:
          type: string
        ownerUserId:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: Non-secret lookup prefix only.
        permissions:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [active, revoked, expired]
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    ApiCredentialIssuance:
      type: object
      required: [id, tenantId, ownerUserId, name, prefix, permissions, createdAt, status, version, secret]
      properties:
        id:
          type: string
        tenantId:
          type: string
        ownerUserId:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: Non-secret lookup prefix only.
        permissions:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [active, revoked, expired]
        version:
          type: integer
          minimum: 1
        secret:
          type: string
          readOnly: true
          description: One-time secret, returned only in the initial successful issuance response.
          x-one-time-disclosure: true
      additionalProperties: false
    ApiCredentialPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ApiCredential"
    IntegrationEvent:
      $ref: "./integration-events-v1.yaml"
    EventAcceptance:
      type: object
      required: [eventId, status, acceptedAt]
      properties:
        eventId:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, replay_scheduled]
        acceptedAt:
          type: string
          format: date-time
      additionalProperties: false
    EventType:
      type: object
      required: [eventType, schemaVersion, sourceModule, documentation, compatibility]
      properties:
        eventType:
          type: string
        schemaVersion:
          type: string
        sourceModule:
          type: string
        documentation:
          type: string
          format: uri-reference
        compatibility:
          type: string
          enum: [backward_compatible, migration_required]
        schema:
          type: object
          description: Registered JSON Schema for the event data.
      additionalProperties: false
    EventTypePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/EventType"
    EventRecord:
      type: object
      required: [event_id, aggregate_id, tenant_id, timestamp, event_type, schema_version, source_module, data, metadata, deliveryStatus]
      properties:
        event_id:
          type: string
          format: uuid
        aggregate_id:
          type: string
        tenant_id:
          type: string
        timestamp:
          type: string
          format: date-time
        event_type:
          type: string
        schema_version:
          type: string
        source_module:
          type: string
        data:
          type: object
        metadata:
          type: object
          required: [correlation_id]
          properties:
            correlation_id:
              type: string
              minLength: 1
              maxLength: 128
            traceparent:
              type: string
            causation_id:
              type: string
            idempotency_key:
              type: string
            content_type:
              type: string
        occurred_at:
          type: string
          format: date-time
        deliveryStatus:
          type: string
          enum: [accepted, pending, delivered, retrying, dead_lettered, archived]
      additionalProperties: false
    EventPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/EventRecord"
    CreateEventSubscriptionRequest:
      type: object
      required: [subscriberModuleId, eventTypes]
      properties:
        subscriberModuleId:
          type: string
        eventTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            description: Registered namespace-qualified event type, optionally pinned by schema version.
        aggregateIds:
          type: array
          uniqueItems: true
          items:
            type: string
        retentionDays:
          type: integer
          minimum: 1
          description: Optional tenant-scoped archive retention override; pending obligations are never expired.
      additionalProperties: false
    EventSubscription:
      type: object
      required: [id, tenantId, subscriberModuleId, eventTypes, status, createdAt, version]
      properties:
        id:
          type: string
        tenantId:
          type: string
        subscriberModuleId:
          type: string
        eventTypes:
          type: array
          items:
            type: string
        aggregateIds:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, paused, draining, failed, removed]
        createdAt:
          type: string
          format: date-time
        pendingDeliveries:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    EventSubscriptionPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/EventSubscription"
    UpdateEventSubscriptionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, paused]
      additionalProperties: false
    DeliveryFailure:
      type: object
      required: [eventId, subscriptionId, attempts, firstFailedAt, lastFailedAt, status]
      properties:
        eventId:
          type: string
          format: uuid
        subscriptionId:
          type: string
        attempts:
          type: integer
          minimum: 1
        firstFailedAt:
          type: string
          format: date-time
        lastFailedAt:
          type: string
          format: date-time
        status:
          type: string
          const: dead_lettered
        safeDiagnostic:
          type: string
          description: Redacted diagnostic; payloads and secrets are excluded.
      additionalProperties: false
    DeliveryFailurePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DeliveryFailure"
    ModuleCatalogEntry:
      type: object
      required: [name, version, description, compatibility, standardsVersion, manifest, approval, artifactDigest]
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        category:
          type: string
        language:
          type: string
        compatibility:
          type: string
        standardsVersion:
          type: string
        manifest:
          $ref: "#/components/schemas/ModuleManifestSummary"
        approval:
          $ref: "#/components/schemas/ModuleApprovalSummary"
        artifactDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        dependencies:
          type: array
          items:
            type: string
        documentation:
          type: array
          items:
            type: string
            format: uri-reference
      additionalProperties: false
    ModuleManifestSummary:
      type: object
      required: [name, version, standardsVersion, dependencies, permissions, eventContracts, queryContracts]
      properties:
        name:
          type: string
        version:
          type: string
        standardsVersion:
          type: string
        dependencies:
          type: array
          items:
            type: string
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        eventContracts:
          type: array
          items:
            type: object
            required: [eventType, schemaVersion]
            properties:
              eventType:
                type: string
              schemaVersion:
                type: string
              documentation:
                type: string
                format: uri-reference
            additionalProperties: false
        queryContracts:
          type: array
          items:
            type: object
            required: [name, version]
            properties:
              name:
                type: string
              version:
                type: string
              documentation:
                type: string
                format: uri-reference
            additionalProperties: false
      additionalProperties: false
    ModuleSubmission:
      type: object
      required: [id, tenantId, submittedBy, submittedAt, manifest, artifactDigest, status]
      properties:
        id:
          type: string
        tenantId:
          type: string
        submittedBy:
          type: string
        submittedAt:
          type: string
          format: date-time
        manifest:
          $ref: "#/components/schemas/ModuleManifestSummary"
        artifactDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        status:
          type: string
          enum: [pending_review, approved, rejected, published, revoked]
      additionalProperties: false
    ModuleSubmissionPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ModuleSubmission"
    ModuleCatalogPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ModuleCatalogEntry"
    ModuleApprovalSummary:
      type: object
      required: [status, reviewedAt, reviewedBy, approvedAt, approvedBy, artifactDigest, policyVersion]
      properties:
        status:
          type: string
          const: approved
        reviewedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
        approvedAt:
          type: string
          format: date-time
        approvedBy:
          type: string
        artifactDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        policyVersion:
          type: string
          minLength: 1
      additionalProperties: false
    ApproveModuleRequest:
      type: object
      required: [submissionId, reviewId, artifactDigest, decision]
      properties:
        submissionId:
          type: string
          minLength: 1
        reviewId:
          type: string
          minLength: 1
          description: Identifies the review decision bound to this submission and artifact digest.
        artifactDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        decision:
          type: string
          enum: [approved, rejected]
          description: A positive approval requires a positive review of the same artifact digest.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        supportingEvidenceRef:
          type: string
          minLength: 1
          maxLength: 2048
          description: Optional durable reference supplementing the bound review and standards evidence.
      additionalProperties: false
    RevokeModuleRequest:
      type: object
      required: [artifactDigest, reason]
      properties:
        artifactDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
          description: Immutable platform-computed digest of the exact submission being revoked.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    ReviewModuleRequest:
      type: object
      required: [artifactDigest, decision, standardsAssessment]
      properties:
        artifactDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        decision:
          type: string
          enum: [approved, rejected]
        standardsAssessment:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        supportingEvidenceRef:
          type: string
          minLength: 1
          maxLength: 2048
          description: Optional durable reference supplementing standardsAssessment as decision evidence.
      additionalProperties: false
    ModuleReview:
      type: object
      required: [id, submissionId, artifactDigest, decision, standardsAssessment, reviewedAt, reviewedBy]
      properties:
        id:
          type: string
        submissionId:
          type: string
        artifactDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        decision:
          type: string
          enum: [approved, rejected]
        standardsAssessment:
          type: string
        reviewedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
        reason:
          type: string
      additionalProperties: false
    ModuleApproval:
      type: object
      required: [id, submissionId, reviewId, moduleName, version, artifactDigest, decision, standardsVersion, reviewedAt, reviewedBy, approvedAt, approvedBy, policyVersion]
      properties:
        id:
          type: string
        submissionId:
          type: string
        reviewId:
          type: string
        moduleName:
          type: string
        version:
          type: string
        artifactDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        decision:
          type: string
          enum: [approved, rejected, revoked]
        standardsVersion:
          type: string
        reviewedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
        approvedAt:
          type: string
          format: date-time
        approvedBy:
          type: string
        policyVersion:
          type: string
          minLength: 1
        reason:
          type: string
      additionalProperties: false
    InstallModuleRequest:
      type: object
      required: [moduleName, version, artifactDigest]
      properties:
        moduleName:
          type: string
        version:
          type: string
        artifactDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
      additionalProperties: false
    InstalledModule:
      type: object
      required: [id, tenantId, name, version, artifactDigest, standardsVersion, status, dependencies, createdAt, updatedAt, versionTag]
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        version:
          type: string
        artifactDigest:
          type: string
        standardsVersion:
          type: string
        status:
          type: string
          enum: [registered, validating, starting, running, stopping, stopped, failed, disabled, uninstall_pending, removed]
        dependencies:
          type: array
          items:
            type: string
        dependentModules:
          type: array
          items:
            type: string
        pendingDeliveries:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        versionTag:
          type: integer
          minimum: 1
        failureSummary:
          type: string
          description: Safe diagnostic; no secret values.
      additionalProperties: false
    InstalledModulePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/InstalledModule"
    ModuleLifecycleRequest:
      type: object
      required: [action, reason]
      properties:
        action:
          type: string
          enum: [start, stop]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      additionalProperties: false
    LifecycleOperation:
      type: object
      required: [id, resourceId, operation, status, submittedAt]
      properties:
        id:
          type: string
        resourceId:
          type: string
        operation:
          type: string
          enum: [install, start, stop, uninstall, unregister, compliance_check]
        status:
          type: string
          enum: [pending, running, blocked, succeeded, failed]
        submittedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        pendingDeliveries:
          type: integer
          minimum: 0
        safeDiagnostic:
          type: string
      additionalProperties: false
    ScaffoldModuleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          maxLength: 63
        standardsVersion:
          type: string
          description: Optional requested template version; unsupported or unenforced versions are rejected.
        outputFormat:
          type: string
          enum: [archive, manifest]
          default: archive
      additionalProperties: false
    ScaffoldResult:
      type: object
      required: [moduleName, standardsVersion, templateVersion, generatedAt, artifact, included]
      properties:
        moduleName:
          type: string
        standardsVersion:
          type: string
        templateVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
        artifact:
          type: object
          required: [mediaType, downloadUrl, expiresAt]
          properties:
            mediaType:
              type: string
            downloadUrl:
              type: string
              format: uri
            expiresAt:
              type: string
              format: date-time
          additionalProperties: false
        included:
          type: array
          minItems: 6
          uniqueItems: true
          items:
            type: string
            enum: [module_manifest, domain_model, event_contract, query_interface, tests, governance_files]
      additionalProperties: false
    ScaffoldStandards:
      type: object
      required: [standardsVersion, templateVersion, enforcedForNewInstallations, updatedAt]
      properties:
        standardsVersion:
          type: string
        templateVersion:
          type: string
        enforcedForNewInstallations:
          type: boolean
          const: true
        updatedAt:
          type: string
          format: date-time
        migrationGuide:
          type: string
          format: uri-reference
      additionalProperties: false
    ScaffoldTemplate:
      type: object
      required: [templateVersion, standardsVersion, artifact]
      properties:
        templateVersion:
          type: string
        standardsVersion:
          type: string
        artifact:
          type: object
          required: [mediaType, downloadUrl, expiresAt, digest]
          properties:
            mediaType:
              type: string
            downloadUrl:
              type: string
              format: uri
            expiresAt:
              type: string
              format: date-time
            digest:
              type: string
              pattern: "^sha256:[a-f0-9]{64}$"
          additionalProperties: false
      additionalProperties: false
    ConfigurationScope:
      type: string
      enum: [global, tenant, module]
    ConfigurationSource:
      type: string
      enum: [environment, file, database]
    PutConfigurationRequest:
      type: object
      required: [scope, source, reason]
      properties:
        scope:
          $ref: "#/components/schemas/ConfigurationScope"
        source:
          $ref: "#/components/schemas/ConfigurationSource"
        environment:
          type: string
        value:
          description: Non-secret JSON value only; mutually exclusive with secretReference.
        secretReference:
          type: string
          description: External secret-manager reference only; never submit or return the secret itself.
        schema:
          type: object
          description: Expected value schema; validated before update.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      oneOf:
        - required: [value]
          not:
            required: [secretReference]
        - required: [secretReference]
          not:
            required: [value]
      additionalProperties: false
    PutTenantConfigurationRequest:
      allOf:
        - $ref: "#/components/schemas/PutConfigurationRequest"
        - type: object
          properties:
            scope:
              enum: [tenant, module]
    PutGlobalConfigurationRequest:
      allOf:
        - $ref: "#/components/schemas/PutConfigurationRequest"
        - type: object
          properties:
            scope:
              const: global
    ConfigurationSetting:
      type: object
      required: [key, scope, source, version, secret, activation, updatedAt]
      properties:
        key:
          type: string
        scope:
          $ref: "#/components/schemas/ConfigurationScope"
        tenantId:
          type: [string, "null"]
        moduleId:
          type: [string, "null"]
        environment:
          type: string
        source:
          $ref: "#/components/schemas/ConfigurationSource"
        effective:
          type: boolean
        value:
          description: Effective non-secret value. Omitted for secret settings.
        secret:
          type: boolean
        secretReference:
          type: string
          description: Redacted external reference or stable version identifier, never secret material.
        version:
          type: integer
          minimum: 1
        activation:
          type: string
          enum: [applied, staged_for_restart, rejected]
        updatedAt:
          type: string
          format: date-time
      oneOf:
        - properties:
            secret:
              const: false
          required: [value]
        - properties:
            secret:
              const: true
            value:
              not: {}
          required: [secretReference]
      additionalProperties: false
    ConfigurationPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ConfigurationSetting"
    StandardsVersion:
      type: object
      required: [version, releaseDate, enforcedForNewInstallations, createdAt, changes]
      properties:
        version:
          type: string
        releaseDate:
          type: string
          format: date
        breakingChanges:
          type: array
          items:
            type: string
        changes:
          type: array
          items:
            type: string
        migrationGuide:
          type: string
          format: uri-reference
        gracePeriodEndsAt:
          type: [string, "null"]
          format: date-time
        graceAppliesTo:
          type: string
          const: modules_installed_before_release
        enforcedForNewInstallations:
          type: boolean
          const: true
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    PublishStandardsRequest:
      type: object
      required: [version, releaseDate, changes, enforcedForNewInstallations]
      properties:
        version:
          type: string
        releaseDate:
          type: string
          format: date
        breakingChanges:
          type: array
          items:
            type: string
        changes:
          type: array
          minItems: 1
          items:
            type: string
        migrationGuide:
          type: string
          format: uri-reference
        gracePeriodEndsAt:
          type: [string, "null"]
          format: date-time
          description: Optional grace deadline for modules already installed at release time only.
        enforcedForNewInstallations:
          type: boolean
          const: true
      additionalProperties: false
    StandardsVersionPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/StandardsVersion"
    CreateComplianceReportRequest:
      type: object
      properties:
        moduleIds:
          type: array
          uniqueItems: true
          items:
            type: string
        standardsVersion:
          type: string
          description: Defaults to standards applicable to each module at assessment time.
      additionalProperties: false
    ComplianceViolation:
      type: object
      required: [ruleId, severity, description, enforcement, remediation]
      properties:
        ruleId:
          type: string
        severity:
          type: string
          enum: [info, warning, error, critical]
        description:
          type: string
        enforcement:
          type: string
          enum: [enforced, grace_period, advisory]
        gracePeriodEndsAt:
          type: [string, "null"]
          format: date-time
        remediation:
          type: string
      additionalProperties: false
    ComplianceReport:
      type: object
      required: [id, tenantId, moduleId, moduleVersion, declaredStandardsVersion, assessedStandardsVersion, status, violations, timestamp]
      properties:
        id:
          type: string
        tenantId:
          type: string
        moduleId:
          type: string
        moduleVersion:
          type: string
        declaredStandardsVersion:
          type: string
        assessedStandardsVersion:
          type: string
        status:
          type: string
          enum: [compliant, grace_period, non_compliant, failed]
        violations:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceViolation"
        timestamp:
          type: string
          format: date-time
      additionalProperties: false
    ComplianceReportPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ComplianceReport"
    AuditRecord:
      type: object
      required: [id, occurredAt, action, actorType, outcome, correlationId, changes]
      properties:
        id:
          type: string
        tenantId:
          type: [string, "null"]
        occurredAt:
          type: string
          format: date-time
        actorType:
          type: string
          enum: [tenant_user, api_credential, platform_operator, system]
        actorId:
          type: [string, "null"]
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        outcome:
          type: string
          enum: [succeeded, denied, failed]
        reason:
          type: string
        correlationId:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/AuditChange"
      additionalProperties: false
    AuditChange:
      type: object
      required: [field, secret, redacted]
      properties:
        field:
          type: string
        secret:
          type: boolean
        before:
          description: Before value for non-secret settings only.
        after:
          description: After value for non-secret settings only.
        redacted:
          type: boolean
          description: True for secret changes; secret values are never included.
        referenceVersion:
          type: string
          description: Optional non-secret external reference or version identifier.
      oneOf:
        - properties:
            secret:
              const: false
            redacted:
              const: false
          required: [before, after]
        - properties:
            secret:
              const: true
            redacted:
              const: true
          not:
            anyOf:
              - required: [before]
              - required: [after]
      additionalProperties: false
    AuditRecordPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditRecord"
    DocumentationSearchResult:
      type: object
      required: [title, slug, section, excerpt, score]
      properties:
        title:
          type: string
        slug:
          type: string
        section:
          type: string
        excerpt:
          type: string
        score:
          type: number
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    DocumentationSearchPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DocumentationSearchResult"
    DocumentationPage:
      type: object
      required: [title, slug, section, content, updatedAt]
      properties:
        title:
          type: string
        slug:
          type: string
        section:
          type: string
          enum: [architecture, api-reference, module-examples, troubleshooting, standards]
        content:
          type: string
          description: Renderable documentation content; HTML must be sanitized by clients.
        updatedAt:
          type: string
          format: date-time
        standardsVersion:
          type: string
        relatedPages:
          type: array
          items:
            type: string
      additionalProperties: false
    TelemetryBatch:
      type: object
      required: [moduleId, records]
      properties:
        moduleId:
          type: string
          description: Must identify an installed module in the authenticated tenant.
        records:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/TelemetryRecord"
      additionalProperties: false
    TelemetryRecord:
      type: object
      required: [kind, name, timestamp]
      properties:
        kind:
          type: string
          enum: [log, span, metric]
        name:
          type: string
          minLength: 1
          maxLength: 256
        timestamp:
          type: string
          format: date-time
        severity:
          type: string
          enum: [trace, debug, info, warn, error, fatal]
        value:
          description: Metric value or other kind-specific scalar data.
        traceId:
          type: string
        spanId:
          type: string
        attributes:
          type: object
          description: Bounded, non-secret and non-sensitive operational attributes only.
          additionalProperties:
            type: [string, number, boolean]
      additionalProperties: false
    TelemetryAcceptance:
      type: object
      required: [accepted, acceptedAt]
      properties:
        accepted:
          type: integer
          minimum: 0
        acceptedAt:
          type: string
          format: date-time
      additionalProperties: false
    Page:
      type: object
      properties:
        nextPageToken:
          type: [string, "null"]
        totalSize:
          type: integer
          minimum: 0
