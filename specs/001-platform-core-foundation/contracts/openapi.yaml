  /tenants/{tenantId}/configurations:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Configuration]
      operationId: listTenantConfigurations
      summary: List effective tenant configuration metadata
      description: Secret values are always redacted. Source priority is environment, file, then database; scope specificity is resolved within a source.
      security:
        - TenantJWT: []
        - ApiCredential: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
        - name: moduleId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Effective configuration metadata.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationPage"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/configurations/{key}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: key
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags: [Configuration]
      operationId: getTenantConfiguration
      summary: Get effective configuration for a tenant
      security:
        - TenantJWT: []
        - ApiCredential: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - name: moduleId
          in: query
          description: Optional module scope; scope specificity is applied within source priority.
          schema:
            type: string
      responses:
        "200":
          description: Effective setting; secret values remain redacted.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationSetting"
        default:
          $ref: "#/components/responses/StandardError"
    put:
      tags: [Configuration]
      operationId: putTenantConfiguration
      summary: Validate and update a tenant configuration setting
      description: |
        Requires configuration-management authority and an audit reason.
        Invalid updates leave the last valid value in force. Non-critical
        settings apply without restart. A database URL update is validated,
        stored only as an external secret reference, and staged until restart;
        no active connection is switched by this request. Audit records retain
        before/after non-secret values and redacted references or versions only
        for secrets.
      x-authorized-roles: [tenant_admin]
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IfMatchOptional"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: moduleId
          in: query
          description: Required when scope is module; tenant and module scopes cannot target another tenant.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutTenantConfigurationRequest"
      responses:
        "200":
          description: Setting validated and saved; status indicates immediate or staged activation.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationSetting"
        default:
          $ref: "#/components/responses/StandardError"
  /platform/configurations:
    get:
