    put:
      tags: [Modules]
      operationId: transitionModuleLifecycle
      summary: Start or stop a tenant module
      description: |
        Applies an authorized lifecycle transition to reviewed code only.
        Failure disables the failed module and transitive dependents while
        leaving the core and unaffected modules available.
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ModuleId"
        - $ref: "#/components/parameters/CorrelationId"
