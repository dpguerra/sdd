openapi: 3.1.0
info:
  title: Platform Core Foundation API
  version: 1.0.0
  summary: Canonical REST contract for the Platform Core Foundation.
  description: |
    Versioned, channel-independent contract for platform infrastructure only.
    Tenant operations require authenticated tenant context; platform operations
    require separately authenticated platform-operator authority. An identifier
    in a path or request never grants authority or selects a tenant by itself.
    All authentication attempts and sensitive state changes are audited. Every
    response returns a correlation identifier; trace context propagates through
    asynchronous work.
servers:
  - url: /v1
    description: Version 1 API
tags:
  - name: Authentication
  - name: Tenants
  - name: Identity
  - name: Credentials
  - name: Events
  - name: Modules
  - name: Scaffolding
  - name: Configuration
  - name: Governance
  - name: Audit
  - name: Documentation
  - name: Platform
security:
  - TenantJWT: []
x-tenant-isolation:
  required: true
  resolution: verified JWT membership or tenant-bound API credential
  mismatchBehavior: deny
  enforcement: application authorization, tenant-aware persistence, database row-level security, cache keys, event routing, and asynchronous consumer revalidation
x-identity-and-session-policy:
  tenantSlugUniqueness: deployment-wide, case-insensitive, independent of parent-child hierarchy
  userEmailUniqueness: case-insensitive within each tenant; the same email may identify separate accounts in different tenants
  uniquenessConflict: return 409 without applying the requested tenant or identity change
  signIn: tenant qualification is required before account lookup
  suspension: deny tenant-initiated business operations; permit explicitly authorized background processing and maintenance in the tenant context with applicable isolation, audit, and event-delivery controls; only a platform-global Platform Operator may suspend or reactivate a tenant
  logout: revoke only the authenticated session's refresh credentials and immediately reject that session's already-issued access tokens on subsequent requests; other sessions remain usable
  sessionValidation: obtain sufficiently current session status for each applicable authorization check; deny if required status cannot be established
  refreshReplay: authenticate the refresh request and revalidate current session status before returning any retry result; never return tokens for a revoked session
  implementationChoices: normalization, uniqueness persistence, session-revocation storage, and recovery strategy are not prescribed here
x-data-ownership-and-protection:
  ownership: each bounded context owns its authoritative data, private persistence boundary, migrations, and applicable Outbox or consumer-owned Inbox
  accessBoundary: no direct cross-context access to another module's private persistence or migrations
  projections: consumer-owned derived data; not a substitute for authoritative source state
  protectedSurfaces: [primary_and_private_persistence, projections, migrations, backups, restores, exports, archives, analytics, persisted_dead_letter_copies]
  copiedData: preserve applicable classification, tenant isolation, retention, and access controls across projections, migrations, backups, restores, exports, archives, analytics, and persisted dead-letter copies
  atRest: applicable sensitive persisted data is protected using AES-256
  implementationChoices: physical database topology and encryption mechanism are not prescribed here
x-delegated-tenant-access:
  mechanism: X-Delegated-Tenant-Grant
  callerIdentity: TenantJWT only
  rule: |
    A parent tenant actor may select a child tenant only by supplying the
    opaque grant identifier in X-Delegated-Tenant-Grant. The server independently
    rechecks the grant on every request: active status, exact child tenant
    context, direct parent relationship, grant permission intersection, actor
    membership and tenant-admin authority, and deployment non-delegable rules.
    The effective tenant context is the child tenant, not the parent. The JWT
    retains the parent actor identity for attributable audit evidence.
  noHierarchyImpliedAccess: true
  transitive: false
  hierarchyChange: inactive_or_removed_grants_are_not_valid_after_the_direct_relationship_changes
  grantScope: operationId-based canonical permissions; unspecified permissions are denied
  untrustedCallerPolicyInputs: []
  applicableOperations:
    - getTenant
    - updateTenant
    - listTenantUsers
    - createTenantUser
    - getTenantUser
    - updateTenantUser
    - replaceTenantUserRoles
    - listApiCredentials
    - issueApiCredential
    - getApiCredential
    - revokeApiCredential
    - listTenantEvents
    - publishTenantEvent
    - listEventSubscriptions
    - createEventSubscription
    - getEventSubscription
    - updateEventSubscription
    - deleteEventSubscription
    - listSubscriptionFailures
    - replayFailedDelivery
    - submitModuleRelease
    - getTenantModuleSubmission
    - listInstalledModules
    - getInstalledModule
    - installModule
    - transitionModuleLifecycle
    - uninstallModule
    - getTenantLifecycleOperation
    - listTenantConfigurations
    - getTenantConfiguration
    - putTenantConfiguration
    - listTenantAuditRecords
    - listComplianceReports
    - createComplianceReport
x-module-governance-separation:
  decisions: [review, approval]
  digestBinding: immutable sha256 platform-computed artifact digest
  reviewRequiredForApproval: true
  lifecycle:
    initialStatus: pending_review
    terminalStatuses: [rejected, revoked]
    statuses: [pending_review, approved, rejected, published, revoked]
    permittedTransitions:
      pending_review_to_approved: positive_review_and_separate_positive_approval_for_the_exact_digest
      pending_review_to_rejected: negative_review_or_negative_approval
      pending_review_to_revoked: governed_withdrawal_or_revocation
      approved_to_published: successful_manifest_validation_and_active_exact_digest_approval
      approved_to_revoked: governed_withdrawal_or_revocation
      published_to_revoked: governed_withdrawal_or_revocation
    invalidTransition: lifecycle_conflict_HTTP_409
    staleSubmissionETag: HTTP_412
    missingSubmissionIfMatch: HTTP_428
    reFetchSubmissionETagForEveryMutation: true
    versionAdvance: every_accepted_review_or_status_transition
    resubmission: creates_a_new_pending_review_submission
    replayPrecedence:
      authFirst: reauthenticate_and_reauthorize_before_returning_any_idempotent_replay
      exactKeyResolutionFirst: resolve_the_scoped_exact_canonical_request_before_submission_preconditions
      staleIfMatchReplay: return_the_recorded_outcome_for_an_exact_retry_even_when_its_original_submission_etag_is_now_stale
      replayEffect: no_new_transition_or_mutation
      keyMismatch: HTTP_409_idempotency_key_reused
  serverPolicy:
    deploymentConfiguredSeparation: enforced by the server at approval time
    policyVersionRecorded: true
    reviewerAndApproverIdentitiesRecorded: true
    callerCannotSupplyPolicyIdentityOrVersion: true
  noSandboxClaim: true
x-release-and-operations-gates:
  wcag: "WCAG 2.2 Level AA is a release gate for the documentation and developer portals; it is not a REST endpoint."
  recovery: "Deployment-specific RPO/RTO and recovery-test evidence are operations/release gates; no platform-wide endpoint or numeric target is defined."
x-pre-exposure-validation:
  appliesTo: each newly exposed or materially changed capability and each channel that exposes it
  requiredEvidence: [versioned_canonical_contract, applicable_contract_tests, architecture_tests, security_and_governance_gates, applicable_channel_compatibility]
  eligibility: fail_closed_if_any_mandatory_evidence_is_missing_failed_expired_or_stale
  revalidation: required_after_material_contract_policy_tenant_enforcement_certification_or_lifecycle_changes
  invalidatedExposure: reconcile_disable_or_withdraw_under_governed_lifecycle; never_report_available_while_a_mandatory_gate_fails
  outage: retain_only_last_validated_configuration_for_still_available_capabilities; do_not_activate_new_or_changed_exposure
  implementationChoices: no Gateway product or validation mechanism is selected here
x-platform-authority:
  requiredFor:
    - root- and child-tenant creation
    - tenant suspension and reactivation
    - initial Tenant Admin bootstrap
    - global configuration and standards publication
    - module-code review and approval, submission publication and revocation
    - platform-wide listings and audit access
  separation: tenant roles and tenant-bound API credentials cannot grant platform authority
x-tenant-provisioning-authority:
  authoritativeActor: platform_operator
  organizationAdministratorPersona: mapped_to_platform_operator_for_v1_tenant_creation_suspension_reactivation_and_initial_admin_bootstrap; not_a_separate_role
  rootCreation: platform_operator_only
  childCreation:
    currentPolicy: platform_operator_only
    parentTenantId: organizational_relationship_only; grants_no_authority
    tenantAdminRequestCapability: future_optional_governed_capability; a_request_never_creates_a_tenant_or_grants_creation_authority
    futureDelegationAfterV1: requires_explicit_scoped_policy; not_implied_by_membership_hierarchy_or_existing_child_administration
  initialTenantAdminBootstrap:
    authority: platform_operator_only
    precondition: no_tenant_admin_exists
    nonAdminUsersDoNotPreventBootstrap: true
    deniedWhenTenantAdminExists: true
  tenantSuspensionAndReactivation: platform_operator_only
x-authorization-policy:
  default: deny
  rule: |
    An operation's operationId is its permission identifier for JWT principals.
    Role grants are additive and apply only after authentication, tenant matching,
    resource ownership, and applicable policy checks. Platform authority is
    separate from tenant roles. Credential scopes are further restricted to
    the current authority of the credential owner.
  roleGrants:
    tenant_admin:
      operations: all operations accepting TenantJWT
      scope: authenticated tenant only; delegated parent-to-child use additionally requires an active child-owned grant and is never transitive
    developer:
      operations: [searchDocumentation, getDocumentationPage, listModuleCatalog, getCatalogModule, listInstalledModules, getInstalledModule, scaffoldModule, getCurrentScaffoldStandards, getScaffoldTemplate, listEventTypes, getEventType, listTenantEvents, publishTenantEvent, listEventSubscriptions, createEventSubscription, getEventSubscription, updateEventSubscription, deleteEventSubscription, listSubscriptionFailures, replayFailedDelivery, submitModuleRelease, getTenantModuleSubmission, listApiCredentials, issueApiCredential, getApiCredential, revokeApiCredential, ingestModuleTelemetry, getTenantLifecycleOperation]
      scope: authenticated tenant; credential and submission management is limited to the caller's own records and lifecycle operation inspection to the caller's own operations
    governance_officer:
      operations: [listComplianceReports, createComplianceReport, listTenantAuditRecords]
      scope: authenticated tenant only
    user:
      operations: [getTenant, getTenantUser, listTenantConfigurations, getTenantConfiguration]
      scope: own user profile and non-secret tenant settings safe for ordinary users only; exclude infrastructure and secret-valued settings and references
    billing_manager:
      operations: []
      scope: no billing privileges until a billing module exists
    platform_operator:
      operations: all operations accepting PlatformJWT
      scope: explicit platform operations only; does not grant tenant access
  credentialScopes:
    events:read: [listEventTypes, getEventType, listTenantEvents]
    events:publish: [publishTenantEvent]
    events:subscribe: [listEventSubscriptions, createEventSubscription, getEventSubscription]
    scaffolds:read: [getCurrentScaffoldStandards, getScaffoldTemplate]
    scaffolds:write: [scaffoldModule]
    configuration:read: [listTenantConfigurations, getTenantConfiguration]
    telemetry:write: [ingestModuleTelemetry]
  credentialRule: |
    Requested scopes must be from this catalog and a subset of the issuer's
    current tenant authority. Revalidate the owner's authority at use; the
    credential cannot grant platform access or exceed the owner's permissions.
  bootstrap: |
    Liveness and readiness are public. Login and refresh authenticate their
    supplied credentials without an existing access token. Logout requires its
    authenticated session. These exceptions do not grant any other operation.
x-auth-bootstrap:
  tenantLogin: validates submitted tenant credentials without an access token; supplied tenant is checked against user membership
  platformLogin: validates submitted operator credentials without an access token
  refresh: authenticates the refresh cookie without an access token
  initialPlatformOperator: provisioned out of band; no public self-elevation or bootstrap operation
x-state-change-policy:
  retrySafety: each state-changing operation defines retry safety, duplicate outcome, operation identity requirements, conflicts, and errors; naturally idempotent operations do not require Idempotency-Key
  idempotencyKey: required only when the operation's retry contract needs an operation identity; concurrent duplicate keys produce one effect
  conflicts: key reuse with a different request returns 409 and has no additional effect
  retention: deployment-defined retention sufficient to cover the supported retry and asynchronous completion windows, including applicable retries after completion
  asynchronousOperationRetention: never delete a key before asynchronous operation completion
  universalNumericRetention: none
  concurrency: updates to existing versioned resources require strong If-Match; configuration PUT requires If-Match for replacement or If-None-Match star for creation; missing, stale, or contradictory preconditions do not mutate state
  mechanism: no idempotency storage or concurrency-control technology is prescribed
  auditing: all authentication attempts and sensitive operations are recorded; secret values are excluded
x-observability-policy:
  requestCorrelation: X-Correlation-Id is accepted and returned
  tracing: W3C trace context propagates through application and asynchronous event handling
  redaction: logs, traces, metrics, and errors exclude credentials and secret values
x-audit-policy:
  immutable: true
  retentionYears: 7
  includes: [authentication_attempts, identity_changes, tenant_changes, module_approval_and_lifecycle, configuration_changes, standards_and_compliance, event_administration]
  secretValues: never_recorded
  moduleSubmission:
    creationReason: server_derived_authorized_partner_release_submission
    publicationReason: server_derived_authorized_catalog_publication_after_manifest_and_exact_digest_validation
    deniedChanges: unauthorized_or_invalid_changes_are_denied_and_audited_without_secret_values
    reasonResolution:
      review: explicit_reason_when_supplied_otherwise_server_derived_decision_reason_with_standards_assessment_evidence
      approval: explicit_reason_when_supplied_otherwise_server_derived_decision_reason_with_bound_review_and_standards_evidence
      revocation: explicit_required_reason
      creation: server_derived_submission_reason
      publication: server_derived_publication_decision_and_manifest_validation_evidence
    auditShape:
      includes: [submissionId, tenantId, actor, time, previousStatus, newStatus, artifactDigest, reason, correlationContext]
      creationPreviousStatus: omitted
      decisionOrSupportingEvidenceReference: required
      policyVersion: recorded_when_applicable
x-event-retention-policy:
  defaultHotRetentionDays: 30
  afterExpiry: archive
  pendingDeliveryObligations: never_expire_or_discard_until_processed
x-standards-grace-policy:
  eligible: modules already installed at the start of the grace period
  security: mandatory security and tenant isolation are never waived
  afterExpiry: disable non-compliant modules and their dependents; keep core and unaffected modules available
x-channel-conformance:
  canonical: REST/OpenAPI
  consumers: [MCP, CLI, GUI, SDK, automation, external integrations]
  rule: channels consume the same authorized application capabilities and cannot add privileged paths or duplicate authoritative policy
x-http-error-mapping:
  "400": malformed_request
  "401": authentication_required_or_invalid_credentials
  "403": authorization_denied_or_tenant_context_mismatch
  "404": resource_not_found_without_cross_tenant_disclosure
  "409": state_conflict_or_idempotency_key_reuse
  "412": stale_if_match_precondition
  "422": schema_or_governance_validation_failed
  "428": required_concurrency_precondition_missing
  "429": rate_limited
  "500": unexpected_platform_error
  "503": dependency_unavailable
paths:
  /health/live:
    get:
      tags: [Platform]
      operationId: getLiveness
      summary: Check process liveness
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        default:
          $ref: "#/components/responses/StandardError"
  /health/ready:
    get:
      tags: [Platform]
      operationId: getReadiness
      summary: Check readiness without exposing dependency details
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: The platform is ready.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: The platform is not ready.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/StandardError"

  /auth/sessions:
    post:
      tags: [Authentication]
      operationId: createTenantSession
      summary: Authenticate a tenant user and issue tokens
      description: |
        Bootstrap authentication: validates supplied credentials without an
        existing access token. The tenant must be active and the authenticated
        user must belong to it. Returns a 15-minute JWT and sets a 7-day,
        Secure, HttpOnly, SameSite refresh cookie; refresh material is never
        returned in the JSON body.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantLoginRequest"
      responses:
        "201":
          description: Tenant session established.
          headers:
            Set-Cookie:
              description: Secure, HttpOnly, SameSite refresh cookie; Path is limited to the refresh endpoint.
              schema:
                type: string
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        default:
          $ref: "#/components/responses/StandardError"
  /auth/tokens/refresh:
    post:
      tags: [Authentication]
      operationId: refreshTenantSession
      summary: Refresh a tenant access token
      description: Authenticates the supplied refresh cookie; no access token is required.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Access token renewed and refresh cookie rotated.
          headers:
            Set-Cookie:
              description: Rotated Secure, HttpOnly, SameSite refresh cookie.
              schema:
                type: string
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        default:
          $ref: "#/components/responses/StandardError"
  /auth/sessions/current:
    delete:
      tags: [Authentication]
      operationId: revokeTenantSession
      summary: Revoke the current tenant session
      description: |
        Revokes only the authenticated session and clears its refresh cookie.
        Its already-issued access tokens are rejected immediately on subsequent
        requests; other sessions remain usable.
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "204":
          description: Session revoked.
          headers:
            Set-Cookie:
              description: Expired refresh cookie.
              schema:
                type: string
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        default:
          $ref: "#/components/responses/StandardError"

  /platform/auth/sessions:
    post:
      tags: [Authentication, Platform]
      operationId: createPlatformSession
      summary: Authenticate a platform operator
      description: |
        Bootstrap authentication for platform operators. Supplied credentials
        are independently authenticated without a previously issued token.
        Initial operator enrollment is an out-of-band deployment responsibility;
        this endpoint cannot create or elevate an operator account.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLoginRequest"
      responses:
        "201":
          description: Platform-operator session established.
          headers:
            Set-Cookie:
              description: Secure, HttpOnly, SameSite refresh cookie, scoped to platform refresh.
              schema:
                type: string
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAccessTokenResponse"
        default:
          $ref: "#/components/responses/StandardError"
  /platform/auth/tokens/refresh:
    post:
      tags: [Authentication, Platform]
      operationId: refreshPlatformSession
      summary: Refresh a platform-operator access token
      description: Authenticates the supplied platform refresh cookie; no access token is required.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Platform access token renewed and refresh cookie rotated.
          headers:
            Set-Cookie:
              description: Rotated Secure, HttpOnly, SameSite platform refresh cookie.
              schema:
                type: string
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAccessTokenResponse"
        default:
          $ref: "#/components/responses/StandardError"
  /platform/auth/sessions/current:
    delete:
      tags: [Authentication, Platform]
      operationId: revokePlatformSession
      summary: Revoke the current platform-operator session
      description: |
        Revokes only the authenticated platform-operator session and clears its
        refresh cookie. Its already-issued access tokens are rejected
        immediately on subsequent requests; other sessions remain usable.
      security:
        - PlatformJWT: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "204":
          description: Session revoked.
          headers:
            Set-Cookie:
              description: Expired platform refresh cookie.
              schema:
                type: string
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        default:
          $ref: "#/components/responses/StandardError"

  /tenants:
    get:
      tags: [Tenants]
      operationId: listTenants
      summary: List tenants for platform operations
      description: Global listing is available only to an authenticated platform operator.
      security:
        - PlatformJWT: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TenantStatus"
      responses:
        "200":
          description: Page of tenant metadata.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPage"
        default:
          $ref: "#/components/responses/StandardError"
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: Provision an isolated tenant
      description: |
        In v1, this is a Platform Operator-only action for root or child tenant
        creation. The Organization Administrator persona maps to this Platform
        Operator authority for provisioning, but is not a separate role.
        Tenant identity and isolation boundaries are provisioned by the
        platform; callers cannot select another tenant's isolation root. An
        optional parentTenantId establishes only the direct organizational
        relationship and grants no authority. A future child-provisioning
        request capability would be explicitly governed and would not create a
        tenant or grant creation authority; no request operation is defined
        here. Any scoped creation delegation after v1 requires an explicit
        policy. Slugs must be unique deployment-wide under case-insensitive
        comparison, regardless of parent-child relationships.
      x-authority: platform_operator
      security:
        - PlatformJWT: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant provisioned.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Tenants]
      operationId: getTenant
      summary: Get tenant metadata
      description: Tenant users may read only their own tenant; platform operators may read any tenant.
      security:
        - TenantJWT: []
        - PlatformJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Tenant metadata.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        default:
          $ref: "#/components/responses/StandardError"
    patch:
      tags: [Tenants]
      operationId: updateTenant
      summary: Update tenant metadata
      description: Tenant slug changes are checked for deployment-wide case-insensitive uniqueness, regardless of parent-child relationships.
      security:
        - PlatformJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: Updated tenant metadata.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/suspension:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    put:
      tags: [Tenants]
      operationId: setTenantSuspension
      summary: Suspend or reactivate a tenant
      description: |
        Platform Operator-only soft status change. Setting status to suspended
        suspends the tenant; setting it to active reactivates the tenant. Tenant
        data is retained under the configured compliance retention policy.
        Suspension denies tenant-initiated business operations. Only explicitly
        authorized background processing and maintenance may continue under
        the tenant context with applicable authorization, isolation, audit, and
        event-delivery controls intact. Tenant-scoped roles cannot perform
        either transition.
      x-authority: platform_operator
      security:
        - PlatformJWT: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSuspensionRequest"
      responses:
        "200":
          description: Tenant status changed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/delegated-admin-grants:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Tenants]
      operationId: listDelegatedAdminGrants
      summary: List grants owned by this child tenant
      description: Only the child tenant may list, create, or revoke grants naming its direct parent. This operation is not itself platform administration.
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Grant metadata for direct-parent administration.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedAdminGrantPage"
        default:
          $ref: "#/components/responses/StandardError"
    post:
      tags: [Tenants]
      operationId: createDelegatedAdminGrant
      summary: Explicitly grant scoped administration to the direct parent
      description: |
        Child-tenant-administrator operation only. The server verifies that the
        supplied parentTenantId is the authenticated child's direct parent and
        rejects transitive, unrelated, or unspecified scopes. No hierarchy access
        is implied. The grant is attributable and audited.
      x-authorized-roles: [tenant_admin]
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDelegatedAdminGrantRequest"
      responses:
        "201":
          description: Explicit child-owned grant created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedAdminGrant"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/delegated-admin-grants/{grantId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    delete:
      tags: [Tenants]
      operationId: revokeDelegatedAdminGrant
      summary: Revoke a child-owned direct-parent grant
      description: Child-tenant-administrator operation. Revocation is attributable and takes effect on subsequent authorization checks.
      x-authorized-roles: [tenant_admin]
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Grant revoked; no further delegated requests are authorized.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        default:
          $ref: "#/components/responses/StandardError"
  /platform/tenants/{tenantId}/bootstrap-administrator:
    post:
      tags: [Identity, Platform]
      operationId: bootstrapTenantAdministrator
      summary: Create the first tenant administrator
      description: |
        Platform-operator bootstrap operation for a tenant.
        It succeeds only once, when the tenant has no Tenant Admin and initial
        bootstrap has not previously completed, and creates exactly one initial
        Tenant Admin even under concurrent attempts. Existing non-admin users
        do not prevent bootstrap. It is denied when a Tenant Admin already
        exists. The supplied password is securely hashed, never returned,
        logged, or included in audit values. Subsequent user management uses
        the tenant identity APIs. Tenant-scoped roles cannot perform this
        initial bootstrap.
      security:
        - PlatformJWT: []
      x-authority: platform_operator
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapTenantAdministratorRequest"
      responses:
        "201":
          description: First tenant administrator created and audited.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/StandardError"

  /tenants/{tenantId}/users:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Identity]
      operationId: listTenantUsers
      summary: List users in the authenticated tenant
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of tenant users.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        default:
          $ref: "#/components/responses/StandardError"
    post:
      tags: [Identity]
      operationId: createTenantUser
      summary: Create a user in the authenticated tenant
      description: |
        Requires tenant-administrator authority. Password input is accepted
        only for enrollment, securely hashed using bcrypt or an equivalent
        password-hashing function, and never returned, logged, or included in
        audit values.
      x-authorized-roles: [tenant_admin]
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Tenant user created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Identity]
      operationId: getTenantUser
      summary: Get a user in the authenticated tenant
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: User record without credential material.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/StandardError"
    patch:
      tags: [Identity]
      operationId: updateTenantUser
      summary: Update a user profile
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/users/{userId}/roles:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Identity]
      operationId: replaceTenantUserRoles
      summary: Replace a user's tenant roles
      description: |
        Roles are limited to the v1 platform role catalog. The caller must be
        authorized to administer tenant identity; assignment cannot grant
        platform-operator authority.
      x-authorized-roles: [tenant_admin]
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRolesRequest"
      responses:
        "200":
          description: Role assignment replaced.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/StandardError"

  /tenants/{tenantId}/api-credentials:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Credentials]
      operationId: listApiCredentials
      summary: List tenant API credentials
      description: Lists credential metadata only; secret material is never recoverable.
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of credential metadata.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiCredentialPage"
        default:
          $ref: "#/components/responses/StandardError"
    post:
      tags: [Credentials]
      operationId: issueApiCredential
      summary: Issue a tenant API credential
      description: |
        Requires authenticated developer or tenant-admin authority. The secret
        is emitted only in the initial 201 response. Idempotent retries return
        credential metadata without the secret. No read, list, or later issuance
        response contains secret material.
      x-authorized-roles: [tenant_admin, developer]
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueApiCredentialRequest"
      responses:
        "201":
          description: Credential created; secret returned for this response only.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiCredentialIssuance"
        "200":
          description: Idempotency replay; the credential exists but its one-time secret is not returned.
          headers:
            Idempotency-Replayed:
              schema:
                type: boolean
                const: true
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiCredential"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/api-credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CredentialId"
    get:
      tags: [Credentials]
      operationId: getApiCredential
      summary: Get API credential metadata
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Credential metadata without secret material.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiCredential"
        default:
          $ref: "#/components/responses/StandardError"
    delete:
      tags: [Credentials]
      operationId: revokeApiCredential
      summary: Revoke a tenant API credential
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Credential revoked.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        default:
          $ref: "#/components/responses/StandardError"

  /event-types:
    get:
      tags: [Events]
      operationId: listEventTypes
      summary: List registered integration-event contracts
      description: Registry entries are namespace-qualified and versioned; only registered schemas may be published.
      security:
        - TenantJWT: []
        - ApiCredential: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
        - name: sourceModule
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Page of registered event types.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTypePage"
        default:
          $ref: "#/components/responses/StandardError"
  /event-types/{eventType}/{schemaVersion}:
    get:
      tags: [Events]
      operationId: getEventType
      summary: Get a registered event schema and documentation
      security:
        - TenantJWT: []
        - ApiCredential: []
      parameters:
        - name: eventType
          in: path
          required: true
          description: Namespace-qualified event type.
          schema:
            type: string
        - name: schemaVersion
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Registered event schema metadata.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventType"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/events:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Events]
      operationId: listTenantEvents
      summary: Query tenant-scoped event records
      security:
        - TenantJWT: []
        - ApiCredential: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
        - name: eventType
          in: query
          schema:
            type: string
        - name: aggregateId
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Page of tenant events; tenant identity is derived from authenticated context.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        default:
          $ref: "#/components/responses/StandardError"
    post:
      tags: [Events]
      operationId: publishTenantEvent
      summary: Publish an integration event
      description: |
        Validates the event against its registered version and authenticated
        tenant. The supplied tenant_id must equal the resolved tenant context.
        Acceptance is recorded through the transactional outbox and delivery is
        at least once; consumers deduplicate by event_id.
      security:
        - TenantJWT: []
        - ApiCredential: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationEvent"
      responses:
        "202":
          description: Event accepted for durable asynchronous delivery.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptance"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/event-subscriptions:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [Events]
      operationId: listEventSubscriptions
      summary: List tenant-scoped event subscriptions
      security:
        - TenantJWT: []
        - ApiCredential: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of subscriptions.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSubscriptionPage"
        default:
          $ref: "#/components/responses/StandardError"
    post:
      tags: [Events]
      operationId: createEventSubscription
      summary: Subscribe an installed module to tenant events
      description: |
        A subscriber can receive only events for its assigned tenant;
        cross-tenant filters are rejected. The subscription receives no events
        accepted before activation. Previously assigned delivery obligations
        remain subject to governed retries and replay.
      security:
        - TenantJWT: []
        - ApiCredential: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventSubscriptionRequest"
      responses:
        "201":
          description: Subscription registered.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSubscription"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/event-subscriptions/{subscriptionId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      tags: [Events]
      operationId: getEventSubscription
      summary: Get a tenant event subscription
      security:
        - TenantJWT: []
        - ApiCredential: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Subscription metadata.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSubscription"
        default:
          $ref: "#/components/responses/StandardError"
    patch:
      tags: [Events]
      operationId: updateEventSubscription
      summary: Pause or resume a subscription
      description: Pausing delivery does not discard accepted events or their delivery obligations.
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateEventSubscriptionRequest"
      responses:
        "200":
          description: Updated subscription.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSubscription"
        default:
          $ref: "#/components/responses/StandardError"
    delete:
      tags: [Events]
      operationId: deleteEventSubscription
      summary: Unregister a subscription after assigned deliveries drain
      description: |
        Accepted deliveries remain obligations. Removal returns an asynchronous
        operation when work is outstanding and does not erase pending,
        in-flight, or dead-lettered deliveries.
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "202":
          description: Unregistration is pending until assigned events are processed.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleOperation"
        "204":
          description: Subscription unregistered; no assigned deliveries remained.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/event-subscriptions/{subscriptionId}/failures:
    get:
      tags: [Events]
      operationId: listSubscriptionFailures
      summary: List persistent delivery failures
      description: Returns dead-letter metadata without discarding the outstanding delivery obligation.
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page of failed delivery metadata.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
