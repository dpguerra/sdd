        manifest and enforced standards, detects dependency cycles, and starts
        only reviewed code. This creates a tenant-scoped enablement referencing
        the shared approved module deployment; it cannot change another tenant's
        enablement. New installs never receive an installed-module standards
        grace period.
      x-authorized-roles: [tenant_admin]
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallModuleRequest"
      responses:
        "202":
          description: Installation lifecycle operation accepted.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleOperation"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/modules/{moduleId}:
