  /tenants/{tenantId}/module-submissions:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      tags: [Modules]
      operationId: submitModuleRelease
      summary: Submit an extension release for operator review
      description: |
        An authorized partner submits the artifact and manifest without core
        repository access. The platform records the authenticated tenant and
        submitter, verifies the artifact digest, and keeps the release unavailable
        for publication or installation pending operator review. Submission
        never executes the artifact.
        Creation audit evidence is server-derived: the reason is
        authorized_partner_release_submission and the decision is create, with
        no previous status; the exact submission and tenant IDs, actor, time,
        immutable platform-computed digest, correlation context, and applicable
        policy version are recorded.
      security:
        - TenantJWT: []
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest, artifact, artifactDigest]
              properties:
                manifest:
                  $ref: "#/components/schemas/ModuleManifestSummary"
                artifact:
                  type: string
                  format: binary
                artifactDigest:
                  type: string
                  pattern: "^sha256:[a-f0-9]{64}$"
              additionalProperties: false
            encoding:
              manifest:
                contentType: application/json
      responses:
        "201":
          description: Submitted release is awaiting review.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleSubmission"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/module-submissions/{submissionId}:
    get:
      tags: [Modules]
      operationId: getTenantModuleSubmission
      summary: Inspect an authorized tenant's extension submission
      parameters:
        - $ref: "#/components/parameters/DelegatedTenantGrant"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/CorrelationId"
