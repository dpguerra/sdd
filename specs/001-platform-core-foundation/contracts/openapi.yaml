  /scaffolds/templates/{templateVersion}:
    get:
      tags: [Scaffolding]
      operationId: getScaffoldTemplate
      summary: Download a versioned scaffold template
      description: Used by governed CLI and SDK consumers to refresh templates without embedding independent standards.
      security:
        - TenantJWT: []
        - ApiCredential: []
      parameters:
        - name: templateVersion
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
