  /platform/modules/submissions/{submissionId}/review:
    post:
      tags: [Modules, Platform]
      operationId: reviewModuleRelease
      summary: Record an attributable review decision for the exact submitted artifact
      description: |
        Platform authority only. The review is separately recorded and bound to
        the immutable platform-computed SHA-256 digest of the submitted artifact.
        A positive review is required before the separate approval operation;
        review identity is derived from the authenticated operator, never caller
        policy input. The server rejects mismatched digests or submissions.
        If-Match is checked against the submission resource version obtained by
        re-fetching GET /platform/modules/submissions/{submissionId}, not against
        a response body such as ModuleReview. An accepted positive or negative
        review advances the submission version; a positive review that leaves
        status pending_review also advances it because review state changes.
        A negative review is pending_review -> rejected and terminal.
        Audit reason is the explicit reason field when supplied; otherwise the
        server derives a reason from the review decision. The standardsAssessment
        is supporting evidence; an optional supportingEvidenceRef may identify
        an additional durable evidence record.
        Exact replay with the same Idempotency-Key and request is retry-safe and
        has no additional transition; key reuse with a different request returns
        409 idempotency_key_reused.
        After authentication and authorization are revalidated, exact replay
        resolution occurs before ETag/precondition evaluation: a replay of the
        accepted original request returns its recorded outcome even if its
        submitted If-Match is now stale. It is not evaluated as a fresh mutation.
      security:
        - PlatformJWT: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewModuleRequest"
      responses:
        "201":
          description: Review decision recorded and audited.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleReview"
        "409":
          description: Invalid transition uses code lifecycle_conflict; reuse of an idempotency key for a different request uses code idempotency_key_reused.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: Submission ETag is stale; re-fetch the submission and retry with its fresh ETag.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: If-Match is missing for this submission mutation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/StandardError"
  /platform/modules/submissions/{submissionId}/publication:
    post:
      tags: [Modules, Platform]
      operationId: publishModuleSubmission
      summary: Publish an approved extension release
      description: |
        Requires platform authority, successful manifest validation, and an
        active review approval for the exact submitted artifact digest.
        Unapproved, rejected, revoked, or changed artifacts cannot be published.
        Publication audit evidence is server-derived: the reason is authorized
        catalog publication after manifest and exact-digest validation, the
        decision is published, and supporting evidence references the successful
        manifest and active positive review/approval evidence.
        If-Match is checked against the submission resource version obtained by
        re-fetching GET /platform/modules/submissions/{submissionId}, not against
        a ModuleCatalogEntry representation. Publication is approved -> published
        only and does not install, activate, expose, or route-enable the module.
        Exact replay with the same Idempotency-Key and request is retry-safe and
        has no additional transition; key reuse with a different request returns
        409 idempotency_key_reused.
        After authentication and authorization are revalidated, exact replay
        resolution occurs before ETag/precondition evaluation: a replay of the
        accepted original publication returns its recorded outcome even if its
        submitted If-Match is now stale. It is not evaluated as a fresh mutation.
      security:
        - PlatformJWT: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "201":
          description: Approved release published to the catalog.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleCatalogEntry"
        "409":
          description: Invalid transition uses code lifecycle_conflict; reuse of an idempotency key for a different request uses code idempotency_key_reused.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: Submission ETag is stale; re-fetch the submission and retry with its fresh ETag.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: If-Match is missing for this submission mutation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/StandardError"
  /platform/modules/submissions/{submissionId}/revocation:
    post:
      tags: [Modules, Platform]
      operationId: revokeModuleSubmission
      summary: Governedly revoke or withdraw a module submission
      description: |
        Platform authority only. Revocation is permitted only from
        pending_review, approved, or published and changes the submission to
        terminal revoked. Rejected and revoked are terminal and cannot be
        revocation targets. The request artifactDigest must equal the submission's
        immutable platform-computed SHA-256 digest.
        If-Match is checked against the submission resource version obtained by
        re-fetching GET /platform/modules/submissions/{submissionId}, not against
        a prior review, approval, publication, or catalog response. Revoke this
        exact submission once; re-fetching is required after a stale 412.
        Revocation invalidates applicable approval and availability eligibility,
        and any affected installation, route, or exposure is reconciled or
        withdrawn by separate governed lifecycle controls. It does not discard
        pending delivery obligations and is not an exposure operation.
        The explicit reason is retained as the revocation decision rationale;
        the audit record also contains the previous/new status, exact digest,
        actor, time, tenant, correlation context, and policy version.
        Exact replay with the same Idempotency-Key and request is retry-safe and
        has no additional transition; key reuse with a different request returns
        409 idempotency_key_reused.
        After authentication and authorization are revalidated, exact replay
        resolution occurs before ETag/precondition evaluation: a replay of the
        accepted original revocation returns its recorded outcome even if its
        submitted If-Match is now stale. It is not evaluated as a fresh mutation.
      security:
        - PlatformJWT: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeModuleRequest"
      responses:
        "200":
          description: Submission revoked and reconciliatory lifecycle eligibility invalidated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleSubmission"
        "409":
          description: Invalid transition uses code lifecycle_conflict; reuse of an idempotency key for a different request uses code idempotency_key_reused.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: Submission ETag is stale; re-fetch the submission and retry with its fresh ETag.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: If-Match is missing for this submission mutation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/StandardError"
