  /platform/modules/approvals:
    post:
      tags: [Modules, Platform]
      operationId: approveModuleRelease
      summary: Record a separate operator approval decision for a module release
      description: |
        Platform authority only. A positive approval requires a positive review
        decision for the same immutable submitted artifact digest and its
        standards assessment. The server enforces the deployment-configured,
        versioned reviewer/approver separation policy for positive approval.
        The caller never supplies or overrides policy. Both reviewer and
        approver identities and the effective policy version are retained in
        the immutable result. A rejected approval cannot be published or
        installed. A positive approval is required before publication or
        installation.
        If-Match is checked against the submission resource version obtained by
        re-fetching GET /platform/modules/submissions/{submissionId}; submissionId
        and artifactDigest are supplied by the request and must both match the
        exact submission and immutable platform-computed digest. Do not use an
        ETag from a ModuleApproval response. A positive approval is
        pending_review -> approved; a negative approval is pending_review ->
        rejected and terminal. Exact replay with the same Idempotency-Key and
        request is retry-safe and has no additional transition; key reuse with a
        different request returns 409 idempotency_key_reused.
        Audit reason is the explicit reason field when supplied; otherwise it is
        derived from the bound review decision and its
        standards assessment supporting evidence. An optional supportingEvidenceRef
        may identify additional durable evidence.
        After authentication and authorization are revalidated, exact replay
        resolution occurs before ETag/precondition evaluation: a replay of the
        accepted original approval returns its recorded outcome even if its
        submitted If-Match is now stale. It is not evaluated as a fresh mutation.
      security:
        - PlatformJWT: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveModuleRequest"
      responses:
        "201":
          description: Approval decision recorded and audited.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleApproval"
        "409":
          description: Invalid transition uses code lifecycle_conflict; reuse of an idempotency key for a different request uses code idempotency_key_reused.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: Submission ETag is stale; re-fetch the submission and retry with its fresh ETag.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: If-Match is missing for this submission mutation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/StandardError"
  /tenants/{tenantId}/modules:
    parameters:
